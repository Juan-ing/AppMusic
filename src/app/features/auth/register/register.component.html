<main class="auth-page">
  <section class="auth-card register-card">
    <div class="brand"><span class="brand-mark">A</span><span>AppMusic</span></div>
    <h1>Únete a AppMusic</h1>
    <p class="auth-subtitle">Tu música comienza aquí</p>
    <button class="google-button" type="button" (click)="loginWithGoogle()" [disabled]="busy">
      <span class="google-g">G</span> Registrarme con Google
    </button>
    <div class="divider"><span>o con tu correo</span></div>
    <form (ngSubmit)="register()" novalidate>
      <label>Nombre completo
        <input type="text" [(ngModel)]="name" name="name" autocomplete="name" placeholder="Tu nombre">
      </label>
      <label>Nombre de usuario
        <input type="text" [(ngModel)]="username" name="username" autocomplete="username" placeholder="usuario123">
      </label>
      <label>Correo electrónico
        <input type="email" [(ngModel)]="email" name="email" autocomplete="email" placeholder="nombre@correo.com">
      </label>
      <div class="password-grid">
        <label>Contraseña
          <span class="password-field">
            <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" name="password" autocomplete="new-password" placeholder="Mínimo 6 caracteres">
            <button type="button" (click)="showPassword = !showPassword">{{ showPassword ? 'Ocultar' : 'Mostrar' }}</button>
          </span>
        </label>
        <label>Confirmar contraseña
          <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="confirmation" name="confirmation" autocomplete="new-password" placeholder="Repite tu contraseña">
        </label>
      </div>
      <p class="form-message error" *ngIf="error">{{ error }}</p>
      <p class="form-message success" *ngIf="success">{{ success }}</p>
      <button class="primary-button" type="submit" [disabled]="busy">{{ busy ? 'Creando cuenta...' : 'Crear cuenta' }}</button>
    </form>
    <p class="auth-switch">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
  </section>
</main>
